<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chantiers">
<title>Suivi Chantiers</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ECEEF0; --surface:#FFFFFF; --surface-2:#F3F5F7; --text:#1B2632; --muted:#5E6B79; --border:#DADFE4;
  --primary:#1E2B3A; --primary-ink:#FFFFFF; --accent:#FFC21A; --accent-ink:#1E2B3A;
  --success:#2E9E6A; --danger:#D2453B; --info:#2F6FC4; --warning:#B87900;
  --success-bg:#E3F4EC; --danger-bg:#FBE7E5; --info-bg:#E5EEFA; --warn-bg:#FFF4D6;
  --hero:#1E2B3A; --cell-off:#2A3A4D; --focus:rgba(47,111,196,.28);
  --shadow:0 1px 0 rgba(27,38,50,.04),0 6px 20px -12px rgba(27,38,50,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171E; --surface:#19212B; --surface-2:#212B37; --text:#E6EBF0; --muted:#94A1AF; --border:#2B3643;
    --primary:#4E7098; --primary-ink:#FFFFFF;
    --success-bg:#17332A; --danger-bg:#3A1F1E; --info-bg:#1A2B44; --warn-bg:#3A2F12; --warning:#E7B84A;
    --hero:#0C1117; --cell-off:#1D2835; --focus:rgba(110,155,209,.35);
    --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#19212B; --surface-2:#212B37; --text:#E6EBF0; --muted:#94A1AF; --border:#2B3643;
  --primary:#4E7098; --primary-ink:#FFFFFF;
  --success-bg:#17332A; --danger-bg:#3A1F1E; --info-bg:#1A2B44; --warn-bg:#3A2F12; --warning:#E7B84A;
  --hero:#0C1117; --cell-off:#1D2835; --focus:rgba(110,155,209,.35);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -14px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100%}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.ic{flex:none;display:block}

.wrap{max-width:980px;margin:0 auto;padding:0 16px 40px}
.wrap.has-fab{padding-bottom:120px}
.wrap.wide{max-width:1360px}

/* ---------- barre haute ---------- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;height:70px;margin:0 -16px;padding:0 16px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:42px;height:42px;border-radius:10px;background:var(--hero);display:grid;place-items:center;color:var(--accent);flex:none}
.brand h1,.titlebox h1{font-stretch:78%;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.brand h1{font-size:23px}
.brand p{font-size:12.5px;color:var(--muted)}
.titlebox{flex:1;min-width:0}
.titlebox h1{font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox a,.titlebox .hint{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.titlebox a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox a:hover{color:var(--text)}
.icon-btn{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);flex:none;transition:border-color .15s}
.icon-btn:hover{border-color:var(--muted)}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:8px;font-weight:650;font-size:15px;border:1px solid transparent;white-space:nowrap;transition:filter .15s,border-color .15s}
.btn:hover{filter:brightness(1.06)}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--muted);filter:none}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{height:36px;padding:0 12px;font-size:13.5px}
.btn-block{width:100%}
.btn-icon{width:46px;padding:0;flex:none!important}
.btn-icon.danger{color:var(--danger)}
.linklike{color:var(--info);font-weight:650;text-decoration:underline;text-underline-offset:2px}
.show-sm{display:grid}.hide-sm{display:none}
@media(min-width:720px){.show-sm{display:none}.hide-sm{display:inline-flex}}

/* ---------- recherche ---------- */
.search{position:relative;margin:2px 0 16px}
.search>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:50px;border-radius:10px;border:1px solid var(--border);background:var(--surface);padding:0 16px 0 44px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--info);box-shadow:0 0 0 4px var(--focus)}
.search input::-webkit-search-cancel-button{cursor:pointer}

/* ---------- indicateurs ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:22px}
.kpis.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.kpis.four{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);padding:12px 14px}
.kpi b{display:block;font-size:26px;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--danger)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 10px}
.section-head h2{font-size:17px;font-weight:750;font-stretch:85%}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- barre segmentée (cellules de panneau) ---------- */
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;flex:1}
.cells i{height:8px;border-radius:2px;background:var(--surface-2);border:1px solid var(--border)}
.cells i.on{background:var(--accent);border-color:transparent}
.cells i.half{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-2) 50%)}
.cells.done i.on{background:var(--success)}

/* ---------- liste des projets ---------- */
.plist{list-style:none;display:grid;gap:10px}
@media(min-width:720px){.plist{grid-template-columns:repeat(2,1fr)}}
.pcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overflow:hidden;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--muted)}
.pcard.pressing{transform:scale(.985)}
.pcard.pressing::after{content:'';position:absolute;left:0;bottom:0;height:3px;background:var(--danger);animation:press .55s linear forwards}
@keyframes press{from{width:0}to{width:100%}}
.pcard-head{display:flex;gap:12px;align-items:flex-start}
.pcard-body{flex:1;min-width:0}
.pcard-title{font-weight:750;font-size:17px;font-stretch:88%;line-height:1.25}
.pcard-addr{display:flex;gap:5px;align-items:center;color:var(--muted);font-size:13px;margin-top:3px}
.pcard-addr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pct{font-weight:800;font-stretch:78%;font-size:24px;font-variant-numeric:tabular-nums;line-height:1}
.pct small{font-size:14px;color:var(--muted);font-weight:700}
.pcard .cells{margin:14px 0 12px}
.pcard-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:6px;background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--muted);max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warning)}
.avatars{display:flex;margin-left:auto;flex:none}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.avatars .av{border:2px solid var(--surface)}
.avatars .av+.av{margin-left:-8px}
.av.more{background:var(--surface-2);color:var(--muted)}
.av.xs{width:20px;height:20px;font-size:9px}
.av.lg{width:42px;height:42px;font-size:14px}

.fab{position:fixed;right:max(18px,calc((100vw - 980px)/2 + 18px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;z-index:30;box-shadow:0 10px 26px -8px rgba(184,121,0,.55),0 2px 6px rgba(0,0,0,.12);transition:transform .15s}
.fab:active{transform:scale(.94)}

/* ---------- états vides ---------- */
.empty{text-align:center;padding:40px 20px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:10px}
.em-ic{width:60px;height:60px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 14px;color:var(--text)}
.empty h3{color:var(--text);font-size:17px;font-stretch:88%;margin-bottom:6px}
.empty p{font-size:14px;max-width:360px;margin:0 auto 18px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.empty-line{font-size:13.5px;color:var(--muted);padding:12px 14px;border:1px dashed var(--border);border-radius:8px}

/* ---------- bandeau d'avancement ---------- */
.prog{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:border-color .15s}
.prog:hover{border-color:var(--muted)}
.prog-num{font-size:27px;font-weight:800;font-stretch:76%;font-variant-numeric:tabular-nums;line-height:1;flex:none}
.prog-num small{font-size:14px;color:var(--muted)}
.prog-main{flex:1;min-width:0}
.phases{display:flex;gap:3px;height:12px}
.phase{flex:1;min-width:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:2px;overflow:hidden}
.phase i{display:block;height:100%;background:var(--accent)}
.phase.done{border-color:transparent}
.phase.done i{background:var(--success)}
.prog-cap{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:8px}
.prog-cap b{color:var(--text);font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-cap .tail{margin-left:auto;flex:none;padding-left:10px}

/* ---------- zones de la page projet ---------- */
.zone{margin-bottom:26px}
.zone-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zone-head h2{flex:1;font-size:17px;font-weight:750;font-stretch:85%}
@media(min-width:960px){.two-col{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}.two-col .zone{margin-bottom:0}}
.more-btn{width:100%;height:40px;border-radius:8px;border:1px dashed var(--border);font-size:13.5px;font-weight:650;color:var(--muted)}
.more-btn:hover{border-color:var(--muted);color:var(--text)}

.quicklinks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.ql{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-weight:650;font-size:14px;min-width:0;transition:border-color .15s}
.ql:hover{border-color:var(--muted)}
.ql>span:last-child{min-width:0}
.ql small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
@media(max-width:480px){.ql{flex-direction:column;align-items:flex-start;gap:6px}}

/* ---------- onglets ---------- */
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:15;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--bg);margin:0 -16px;padding:10px 16px;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:8px;font-weight:650;font-size:14.5px;color:var(--muted);transition:color .15s,background .15s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--primary);color:var(--primary-ink)}
.tab .count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-2);color:var(--text);font-size:11.5px;font-weight:750;display:grid;place-items:center}
.tab.active .count{background:var(--accent);color:var(--accent-ink)}
.panel{padding-top:16px}

.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.fchip{flex:none;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--border);background:var(--surface);font-size:13.5px;font-weight:650;color:var(--muted)}
.fchip.active{background:var(--text);border-color:var(--text);color:var(--bg)}

/* ---------- éléments de liste ---------- */
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:border-color .15s}
.item:hover{border-color:var(--muted)}
.item-ic{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;flex:none}
.item-main{flex:1;min-width:0}
.item-title{font-weight:700;font-size:15.5px;line-height:1.3}
.item-sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-meta{display:flex;gap:6px 10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.meta{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.meta.overdue{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-ouverte{background:var(--info-bg);color:var(--info)}
.st-encours{background:var(--warn-bg);color:var(--warning)}
.st-terminee,.st-valide{background:var(--success-bg);color:var(--success)}
.st-brouillon{background:var(--surface-2);color:var(--muted)}
.pr-haute{background:var(--danger-bg);color:var(--danger)}
.pr-basse{background:var(--surface-2);color:var(--muted)}
.datebox{width:50px;flex:none;text-align:center;border-radius:8px;background:var(--surface-2);padding:6px 0}
.datebox b{display:block;font-size:21px;font-weight:800;font-stretch:78%;line-height:1.05}
.datebox span{font-size:11.5px;color:var(--muted);font-weight:650}

/* ---------- étapes ---------- */
.steps-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px 10px}
.step-head{display:flex;align-items:center;gap:10px}
.step-num{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.step.done .step-num{background:var(--success);color:#fff}
.step-name{flex:1;font-weight:700;min-width:0;overflow-wrap:anywhere}
.step-pct{font-weight:800;font-stretch:80%;font-size:18px;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.step.done .step-pct{color:var(--success)}
.step-ctrl{display:flex;gap:2px}
.mini{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.mini:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.quick-pct{display:flex;gap:4px;margin-top:2px}
.quick-pct button{flex:1;height:30px;border-radius:6px;font-size:12.5px;font-weight:650;color:var(--muted);background:var(--surface-2)}
.quick-pct button.active{background:var(--text);color:var(--bg)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;--p:0%;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--p),var(--surface-2) var(--p));border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--primary);margin-top:-10px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--surface-2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--primary)}

/* ---------- documents ---------- */
.doc-group{margin-bottom:22px}
.doc-group-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.doc-group-head h3{font-size:17px;font-stretch:85%;flex:1}
.link-item{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:6px 6px 6px 14px}
.link-main{flex:1;min-width:0;padding:6px 0}
.link-label{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-host{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-main:hover .link-label{text-decoration:underline}

/* ---------- contacts ---------- */
.contact{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.contact .item-main{cursor:pointer}
.contact-actions{display:flex;gap:6px;flex:none}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text);transition:background .15s}
.round:hover{background:var(--accent);color:var(--accent-ink)}

.notice{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:12px 14px;border-radius:8px;background:var(--info-bg);color:var(--text);margin-bottom:12px}
.notice .ic{color:var(--info);margin-top:1px}
.notice.warn{background:var(--warn-bg)}
.notice.warn .ic{color:var(--warning)}
.mt{margin-top:14px}
.mb{margin-bottom:16px}

/* ---------- feuilles (modales) ---------- */
#sheet-root,#dialog-root{position:fixed;inset:0;z-index:100;display:none}
#dialog-root{z-index:150}
#sheet-root.open{display:block}
#dialog-root.open{display:grid;place-items:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(10,15,22,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(100%)}}
@media(min-width:720px){
  .sheet{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:88vh;border-radius:14px;padding-bottom:0;animation:pop .2s ease-out}
  .sheet.lg{width:min(700px,94vw)}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}
}
.sheet-grip{width:40px;height:5px;border-radius:3px;background:var(--border);margin:8px auto 0;flex:none}
@media(min-width:720px){.sheet-grip{display:none}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px 8px 20px;flex:none}
.sheet-head h2{flex:1;font-size:21px;font-weight:800;font-stretch:80%}
.sheet-body{padding:8px 20px 18px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:12px 20px 14px;display:flex;gap:8px;border-top:1px solid var(--border);flex:none}
.sheet-foot .btn{flex:1}

.dialog{position:relative;width:min(400px,100%);background:var(--surface);border-radius:14px;padding:24px 22px 18px;text-align:center;animation:fade .15s}
.dialog-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;background:var(--info-bg);color:var(--info)}
.dialog-ic.danger{background:var(--danger-bg);color:var(--danger)}
.dialog h3{font-size:20px;font-stretch:82%;font-weight:800;margin-bottom:6px}
.dialog p{font-size:14.5px;color:var(--muted);margin-bottom:20px}
.dialog p b{color:var(--text)}
.dialog-actions{display:flex;gap:8px}
.dialog-actions .btn{flex:1}

/* ---------- formulaires ---------- */
.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-size:13.5px;font-weight:650;color:var(--muted);margin-bottom:6px}
.flabel-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.flabel-row label{font-size:13.5px;font-weight:650;color:var(--muted)}
.field input:not([type=range]):not([type=checkbox]),.field select,.field textarea,.input{width:100%;min-height:48px;border-radius:8px;border:1px solid var(--border);background:var(--bg);padding:11px 13px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.field textarea{resize:vertical;min-height:92px;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--info);box-shadow:0 0 0 4px var(--focus)}
.invalid{border-color:var(--danger)!important}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}
.member{display:flex;gap:6px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.member-grid{flex:1;display:grid;gap:6px;min-width:0}
.member .input{min-height:42px;padding:8px 11px;background:var(--surface)}
.member .mini{color:var(--danger)}
.check{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;padding:12px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:38px;border-radius:7px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cr-steps{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--border);border-radius:8px}
.cr-step-head{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.cr-step-head b{font-variant-numeric:tabular-nums}

/* ---------- détails ---------- */
.detail-title{font-size:22px;font-stretch:84%;font-weight:800;line-height:1.2;margin-bottom:8px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0;padding:14px;border-radius:8px;background:var(--surface-2)}
.dl .full{grid-column:1/-1}
.dl dt{font-size:12.5px;color:var(--muted);font-weight:600}
.dl dd{font-weight:650;display:flex;align-items:center;gap:6px;flex-wrap:wrap;overflow-wrap:anywhere}
.prewrap{white-space:pre-wrap;overflow-wrap:anywhere}
.rv-sec{margin-top:16px}
.rv-sec h4{font-size:15px;font-stretch:88%;font-weight:750;margin-bottom:4px;padding-left:10px;border-left:3px solid var(--accent)}
.rv-steps{display:grid;gap:8px;margin-top:6px}
.rv-step{display:grid;grid-template-columns:1fr 110px 44px;gap:10px;align-items:center;font-size:14px}
.rv-step b{text-align:right;font-variant-numeric:tabular-nums}
.mail-subj{font-weight:700;margin-bottom:12px}
.mail-body{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.5;background:var(--surface-2);padding:14px;border-radius:8px;max-height:44vh;overflow:auto;margin-bottom:12px}
.recips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

.settings-list{display:grid;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;cursor:pointer;border-bottom:1px solid var(--border);width:100%}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--surface-2)}
.srow b{display:block;font-weight:650}
.srow small{display:block;color:var(--muted);font-size:12.5px}
.srow.danger{color:var(--danger)}

/* ---------- vue globale ---------- */
.gtoolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.gtoolbar .search{flex:1;min-width:220px;margin:0}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:1040px}
th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
th .sort{opacity:.35;font-size:10px;margin-left:3px}
th.sorted{color:var(--text)}
th.sorted .sort{opacity:1}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums}
td .muted,.muted{color:var(--muted)}
.tprog{display:flex;align-items:center;gap:10px;min-width:170px}
.tprog b{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.tprog .cells i{height:7px}
td .avatars{margin-left:0}

/* ---------- toast ---------- */
#toast-root{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:grid;gap:8px;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:8px;font-size:14px;font-weight:650;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .22s ease-out;text-align:center}
.toast.out{opacity:0;transform:translateY(6px);transition:.2s}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}

/* --- Connexion et synchronisation --- */
.auth{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.auth[hidden]{display:none}
.auth[data-boot] .auth-sub{color:var(--muted)}
#au-form[hidden]{display:none}
.auth-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px;box-shadow:var(--shadow)}
.auth-mark{width:52px;height:52px;border-radius:12px;background:var(--hero);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.auth-mark svg{color:var(--accent)}
.auth h1{font-size:21px;font-weight:750;text-align:center;letter-spacing:-.01em}
.auth-sub{text-align:center;color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.auth .field{margin-bottom:14px}
.auth-err{background:var(--danger-bg);color:var(--danger);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;font-weight:600}
.auth-err[hidden]{display:none}
.auth-alt{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.auth-link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:6px;text-align:center}
.auth-link:hover{color:var(--text)}
.auth-foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--border);color:var(--muted);font-size:12.5px;text-align:center;line-height:1.5}
.syncbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warning);border:1px solid currentColor;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:650;box-shadow:var(--shadow)}
.syncbar[hidden]{display:none}
.syncdot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.acct{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:6px}
.acct b{display:block;font-size:13.5px;word-break:break-all}
.acct small{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<div id="auth" class="auth" data-boot>
  <div class="auth-box">
    <div class="auth-mark"><svg class="ic" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg></div>
    <h1>Suivi Chantiers</h1>
    <p class="auth-sub" id="au-sub">Connexion en cours…</p>
    <div id="au-form" hidden>
    <div class="field"><label for="au-mail">Adresse e-mail</label><input id="au-mail" type="email" autocomplete="username" inputmode="email" placeholder="prenom.nom@apexenergies.fr"></div>
    <div class="field"><label for="au-pass">Mot de passe</label><input id="au-pass" type="password" autocomplete="current-password" placeholder="Au moins 6 caractères"></div>
    <p class="auth-err" id="au-err" hidden></p>
    <button class="btn btn-primary btn-block" id="au-go">Se connecter</button>
    <div class="auth-alt">
      <button class="auth-link" id="au-mode">Premier accès ? Créer mon compte</button>
      <button class="auth-link" id="au-forgot">Mot de passe oublié</button>
    </div>
    </div>
    <p class="auth-foot">Vos chantiers sont synchronisés entre tous vos appareils. Vous ne voyez que les projets dont votre adresse fait partie de l'équipe.</p>
  </div>
</div>
<div id="syncbar" class="syncbar" hidden><span class="syncdot"></span><span id="syncmsg"></span></div>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, sendPasswordResetEmail, updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, setDoc, deleteDoc, onSnapshot, query, where
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRzjDgDUmmmFbLYlUJJOcE-fjfkvMp0aw",
  authDomain: "ascae-26d67.firebaseapp.com",
  projectId: "ascae-26d67",
  storageBucket: "ascae-26d67.firebasestorage.app",
  messagingSenderId: "465256413978",
  appId: "1:465256413978:web:c56499cc4a8a6cd7414aa3"
};

const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fbDb = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

(() => {
'use strict';

/* =========================================================
   Données
   ========================================================= */
const LS_KEY = 'suivi-chantiers:v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

const LS_PREFS = 'suivi-chantiers:prefs';

/* Préférences d'appareil (nom, thème) : locales. Projets : Firestore. */
let state = load();

function load() {
  const settings = { userName: '', theme: 'auto' };
  try {
    const raw = localStorage.getItem(LS_PREFS);
    if (raw) Object.assign(settings, JSON.parse(raw) || {});
    else {
      const old = localStorage.getItem(LS_KEY);
      if (old) Object.assign(settings, (JSON.parse(old) || {}).settings || {});
    }
  } catch (e) {}
  return { projects: [], settings };
}
/* Projets restés dans l'ancien stockage local, pour la reprise unique. */
function legacyProjects() {
  try {
    const d = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (d && Array.isArray(d.projects) && d.projects.length) return normalize(d).projects;
  } catch (e) {}
  return [];
}
function normalize(d) {
  d.settings = Object.assign({ userName: '', theme: 'auto' }, d.settings || {});
  d.projects.forEach(p => {
    p.users = p.users || []; p.steps = p.steps || []; p.contacts = p.contacts || [];
    p.requests = p.requests || []; p.reports = p.reports || [];
    p.links = p.links || {};
    ['plans', 'photos', 'planning'].forEach(k => { p.links[k] = p.links[k] || []; });
  });
  return d;
}
function save() {
  try { localStorage.setItem(LS_PREFS, JSON.stringify(state.settings)); } catch (e) {}
  pushChanges();
}
const getP = id => state.projects.find(p => p.id === id);
function touch(p) { p.updatedAt = Date.now(); save(); }


/* =========================================================
   Synchronisation Firestore
   ========================================================= */
const FB = { user: null, email: '', ready: false, stop: null, pending: 0, online: navigator.onLine };
const seenFp = new Map();          // id de projet -> empreinte de la dernière version connue
const PROJETS = collection(fbDb, 'projets');

/* Empreinte stable : clés triées, pour ne pas réécrire un projet inchangé. */
const canon = o => JSON.stringify(o, (k, v) =>
  (v && typeof v === 'object' && !Array.isArray(v))
    ? Object.fromEntries(Object.keys(v).sort().map(x => [x, v[x]]))
    : v);

const lowerMail = m => String(m || '').trim().toLowerCase();

/* Qui a le droit de lire ce projet : le créateur et toute l'équipe. */
function memberEmailsOf(p) {
  const set = new Set();
  if (p.ownerEmail) set.add(lowerMail(p.ownerEmail));
  (p.users || []).forEach(u => { const m = lowerMail(u.email); if (m) set.add(m); });
  if (FB.email) set.add(FB.email);
  return [...set].filter(Boolean);
}

function syncStatus(msg) {
  const bar = $('#syncbar');
  if (!bar) return;
  if (!msg) { bar.hidden = true; return; }
  $('#syncmsg').textContent = msg;
  bar.hidden = false;
}
function refreshStatus() {
  if (!FB.online) syncStatus('Hors connexion, les modifications partiront au retour du réseau');
  else if (FB.pending > 0) syncStatus('Synchronisation…');
  else syncStatus('');
}
addEventListener('online', () => { FB.online = true; refreshStatus(); });
addEventListener('offline', () => { FB.online = false; refreshStatus(); });

/* Écrit les projets modifiés, supprime ceux qui ont disparu. */
function pushChanges() {
  if (!FB.user) return;
  const alive = new Set();
  for (const p of state.projects) {
    alive.add(p.id);
    const fp = canon(p);
    if (seenFp.get(p.id) === fp) continue;
    seenFp.set(p.id, fp);
    FB.pending++; refreshStatus();
    setDoc(doc(PROJETS, p.id), { ...p, memberEmails: memberEmailsOf(p) })
      .catch(err => { console.error(err); toast("Enregistrement refusé : " + (err.code || 'erreur')); })
      .finally(() => { FB.pending--; refreshStatus(); });
  }
  for (const id of [...seenFp.keys()]) {
    if (alive.has(id)) continue;
    seenFp.delete(id);
    deleteDoc(doc(PROJETS, id)).catch(err => console.error(err));
  }
}

/* Fusionne en place pour ne pas casser les références tenues par une feuille ouverte. */
function applySnapshot(list) {
  const byId = new Map(state.projects.map(p => [p.id, p]));
  state.projects = list.map(inc => {
    const cur = byId.get(inc.id);
    if (!cur) return inc;
    Object.keys(cur).forEach(k => { if (!(k in inc)) delete cur[k]; });
    return Object.assign(cur, inc);
  });
}

function startSync() {
  if (FB.stop) FB.stop();
  const q = query(PROJETS, where('memberEmails', 'array-contains', FB.email));
  FB.stop = onSnapshot(q, snap => {
    const list = [];
    snap.forEach(d => {
      const p = d.data();
      delete p.memberEmails;
      if (!p.id) p.id = d.id;
      list.push(p);
      seenFp.set(p.id, canon(p));
    });
    applySnapshot(normalize({ projects: list, settings: state.settings }).projects);
    const first = !FB.ready;
    FB.ready = true;
    rerender();
    if (first) offerLegacyImport();
  }, err => {
    console.error(err);
    FB.ready = true;
    syncStatus('Synchronisation interrompue : ' + (err.code || 'erreur'));
  });
}

/* Reprise unique des chantiers créés avant la synchronisation. */
async function offerLegacyImport() {
  const old = legacyProjects();
  if (!old.length || localStorage.getItem('suivi-chantiers:migrated')) return;
  const known = new Set(state.projects.map(p => p.id));
  const todo = old.filter(p => !known.has(p.id));
  if (!todo.length) { localStorage.setItem('suivi-chantiers:migrated', '1'); return; }
  const ok = await confirmDialog({
    title: 'Reprendre vos chantiers ?',
    message: `${plural(todo.length, 'projet')} enregistré${todo.length > 1 ? 's' : ''} sur cet appareil avant la synchronisation. Les envoyer vers votre compte ?`,
    confirm: 'Reprendre', danger: false
  });
  localStorage.setItem('suivi-chantiers:migrated', '1');
  if (!ok) return;
  todo.forEach(p => { if (!p.ownerEmail) p.ownerEmail = FB.email; state.projects.push(p); });
  save(); rerender(); toast(plural(todo.length, 'projet') + ' repris');
}

/* --- Écran de connexion --- */
const AUTH_MSG = {
  'auth/invalid-email': "Cette adresse e-mail n'est pas valide",
  'auth/invalid-credential': 'Adresse e-mail ou mot de passe incorrect',
  'auth/wrong-password': 'Adresse e-mail ou mot de passe incorrect',
  'auth/user-not-found': "Aucun compte avec cette adresse. Créez-le d'abord.",
  'auth/email-already-in-use': 'Un compte existe déjà avec cette adresse. Connectez-vous.',
  'auth/weak-password': 'Le mot de passe doit faire au moins 6 caractères',
  'auth/too-many-requests': 'Trop de tentatives. Réessayez dans quelques minutes.',
  'auth/network-request-failed': 'Pas de connexion réseau',
  'auth/operation-not-allowed': "La connexion par e-mail n'est pas activée dans Firebase"
};
function authSetup() {
  const box = $('#auth'), mail = $('#au-mail'), pass = $('#au-pass');
  const err = $('#au-err'), go = $('#au-go'), mode = $('#au-mode'), sub = $('#au-sub');
  let creating = false;

  const fail = e => {
    err.textContent = AUTH_MSG[e && e.code] || "Connexion impossible" + (e && e.code ? ' (' + e.code + ')' : '');
    err.hidden = false;
  };
  const busy = on => { go.disabled = on; go.textContent = on ? 'Patientez…' : (creating ? 'Créer mon compte' : 'Se connecter'); };

  mode.onclick = () => {
    creating = !creating;
    err.hidden = true;
    sub.textContent = creating ? 'Créez votre compte avec votre adresse professionnelle' : 'Connectez-vous pour retrouver vos chantiers';
    go.textContent = creating ? 'Créer mon compte' : 'Se connecter';
    mode.textContent = creating ? "J'ai déjà un compte" : 'Premier accès ? Créer mon compte';
    pass.autocomplete = creating ? 'new-password' : 'current-password';
  };

  go.onclick = async () => {
    const m = mail.value.trim(), pw = pass.value;
    err.hidden = true;
    if (!isEmail(m)) { mail.classList.add('invalid'); mail.focus(); return fail({ code: 'auth/invalid-email' }); }
    if (pw.length < 6) { pass.classList.add('invalid'); pass.focus(); return fail({ code: 'auth/weak-password' }); }
    mail.classList.remove('invalid'); pass.classList.remove('invalid');
    busy(true);
    try {
      if (creating) {
        const cred = await createUserWithEmailAndPassword(fbAuth, m, pw);
        if (state.settings.userName) await updateProfile(cred.user, { displayName: state.settings.userName }).catch(() => {});
      } else {
        await signInWithEmailAndPassword(fbAuth, m, pw);
      }
      pass.value = '';
    } catch (e) { fail(e); } finally { busy(false); }
  };

  $('#au-forgot').onclick = async () => {
    const m = mail.value.trim();
    if (!isEmail(m)) { mail.classList.add('invalid'); mail.focus(); return fail({ code: 'auth/invalid-email' }); }
    try {
      await sendPasswordResetEmail(fbAuth, m);
      err.hidden = true;
      toast('Message de réinitialisation envoyé à ' + m);
    } catch (e) { fail(e); }
  };

  [mail, pass].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') go.click(); }));

  onAuthStateChanged(fbAuth, user => {
    if (user) {
      FB.user = user; FB.email = lowerMail(user.email);
      box.hidden = true;
      document.body.classList.remove('noscroll');
      if (!state.settings.userName && user.displayName) { state.settings.userName = user.displayName; save(); }
      startSync();
      route();
    } else {
      FB.user = null; FB.email = ''; FB.ready = false;
      $('#au-form').hidden = false;
      $('#au-sub').textContent = creating ? 'Créez votre compte avec votre adresse professionnelle' : 'Connectez-vous pour retrouver vos chantiers';
      if (FB.stop) { FB.stop(); FB.stop = null; }
      seenFp.clear();
      state.projects = [];
      syncStatus('');
      box.removeAttribute('data-boot');
      box.hidden = false;
      mail.focus();
    }
  });
}

async function doSignOut() {
  if (!await confirmDialog({ title: 'Se déconnecter ?', message: 'Vos chantiers restent enregistrés sur votre compte.', confirm: 'Se déconnecter', danger: false })) return;
  closeSheet();
  try { await signOut(fbAuth); toast('Déconnecté'); } catch (e) { toast('Déconnexion impossible'); }
}

   ========================================================= */
const pad = n => String(n).padStart(2, '0');
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dayOffset(0);
function toDate(d) { if (!d) return null; if (typeof d === 'number') return new Date(d); return new Date(d.length === 10 ? d + 'T12:00:00' : d); }
const fmtDate = d => { const x = toDate(d); return x && !isNaN(x) ? x.toLocaleDateString('fr-FR') : '—'; };
const initials = n => (String(n || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('') || '?').toUpperCase();
const COLORS = ['#2F6FC4', '#2E9E6A', '#B87900', '#7C5CC4', '#D2453B', '#0F8FA0', '#B8457A', '#4D5B6E'];
const colorFor = s => { let h = 0; for (const c of String(s || '')) h = (h * 31 + c.charCodeAt(0)) | 0; return COLORS[Math.abs(h) % COLORS.length]; };
const avatar = (name, cls = '') => `<span class="av ${cls}" style="background:${colorFor(name)}" title="${esc(name)}">${esc(initials(name))}</span>`;
const plural = (n, s, p) => n + ' ' + (n > 1 ? (p || s + 's') : s);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const isEmail = e => /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(e);
function safeUrl(u) {
  u = String(u || '').trim(); if (!u) return '';
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
  if (/^(javascript|data|vbscript):/i.test(u)) return '';
  return u;
}
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u; } };
const userById = (p, id) => p.users.find(u => u.id === id);

function progress(p) { if (!p.steps.length) return 0; return Math.round(p.steps.reduce((a, s) => a + (Number(s.progress) || 0), 0) / p.steps.length); }
function currentStep(p) {
  if (!p.steps.length) return 'Étapes à définir';
  const s = p.steps.find(s => (s.progress || 0) < 100);
  return s ? s.name : 'Toutes les étapes terminées';
}
const openReq = p => p.requests.filter(r => r.status !== 'terminee').length;
const lateReq = p => p.requests.filter(r => r.status !== 'terminee' && r.dueDate && r.dueDate < today()).length;
function lastReport(p) { return [...p.reports].sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0]; }
function matches(p, q) {
  if (!q) return true; const t = norm(q);
  return [p.name, p.address, ...p.users.map(u => u.name + ' ' + u.email)].some(x => norm(x).includes(t));
}
function cellsHTML(pct, n = 10) {
  const lit = pct / (100 / n); let h = '';
  for (let i = 0; i < n; i++) h += `<i class="${i < Math.floor(lit) ? 'on' : (i < lit ? 'half' : '')}"></i>`;
  return `<div class="cells ${pct >= 100 ? 'done' : ''}" role="img" aria-label="Avancement ${pct} %">${h}</div>`;
}

function confirmDialog({ title, message, confirm = 'Confirmer', danger = true }) {
  return new Promise(res => {
    const root = $('#dialog-root');
    root.innerHTML = `<div class="scrim"></div><div class="dialog" role="alertdialog" aria-modal="true">
      <div class="dialog-ic ${danger ? 'danger' : ''}">${ic(danger ? 'trash' : 'check', 24)}</div>
      <h3>${esc(title)}</h3><p>${message}</p>
      <div class="dialog-actions"><button class="btn btn-ghost" data-r="0">Annuler</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${esc(confirm)}</button></div></div>`;
    root.classList.add('open');
    const opened = Date.now();
    const done = v => { root.classList.remove('open'); root.innerHTML = ''; document.removeEventListener('keydown', onKey, true); res(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    root.onclick = e => {
      const b = e.target.closest('[data-r]');
      if (b) return done(b.dataset.r === '1');
      if (e.target.classList.contains('scrim') && Date.now() - opened > 450) done(false);
    };
    setTimeout(() => { const b = $('[data-r="0"]', root); b && b.focus(); }, 30);
  });
}

  else if (parts[0] === 'p' && parts[1] && getP(parts[1])) { view = 'p/' + parts[1]; renderProject(getP(parts[1]), parts[2] || 'demandes'); }
  else { view = 'home'; renderHome(); }
  if (view !== lastView) { window.scrollTo(0, 0); lastView = view; }
}

/* Appui long = suppression */
let suppressClick = false, lastPointerType = 'mouse';
function attachLongPress(el) {
  let t = null, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(t); t = null; el.classList.remove('pressing'); };
  el.addEventListener('pointerdown', e => {
    lastPointerType = e.pointerType;
    if (e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; el.classList.add('pressing');
    t = setTimeout(() => {
      t = null; el.classList.remove('pressing');
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 700);
      if (navigator.vibrate) navigator.vibrate(30);
      askDeleteProject(el.dataset.id);
    }, 550);
  });
  el.addEventListener('pointermove', e => { if (t && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, cancel));
  el.addEventListener('contextmenu', e => { e.preventDefault(); if (lastPointerType === 'mouse') askDeleteProject(el.dataset.id); });
}
async function askDeleteProject(id) {
  const p = getP(id); if (!p) return;
  const ok = await confirmDialog({
    title: 'Supprimer ce projet ?',
    message: `<b>${esc(p.name)}</b> sera supprimé avec ses demandes, comptes rendus, étapes, liens et contacts. Cette action est définitive.`,
    confirm: 'Supprimer'
  });
  if (ok) { state.projects = state.projects.filter(x => x.id !== id); save(); toast('Projet supprimé'); rerender(); }
}

function viewReport(p, r) {
  const d = toDate(r.date), sent = r.status === 'valide';
  const sec = (t, c) => c ? `<div class="rv-sec"><h4>${t}</h4><p class="prewrap">${esc(c)}</p></div>` : '';
  const snap = r.stepsSnapshot || [];
  openSheet({
    title: 'Compte rendu', size: 'lg',
    body: `<h3 class="detail-title">${esc(r.title || "Compte rendu d'intervention")}</h3>
      <div class="item-meta"><span class="pill ${sent ? 'st-valide' : 'st-brouillon'}">${sent ? 'Validé et diffusé' : 'Brouillon'}</span>${r.weather ? `<span class="meta">${esc(r.weather)}</span>` : ''}</div>
      <dl class="dl">
        <div><dt>Date</dt><dd>${d ? d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '—'}</dd></div>
        <div><dt>Rédigé par</dt><dd>${r.author ? avatar(r.author, 'xs') + esc(r.author) : '—'}</dd></div>
        ${r.presents ? `<div class="full"><dt>Présents</dt><dd>${esc(r.presents)}</dd></div>` : ''}
        <div><dt>Avancement à cette date</dt><dd>${r.progressAt != null ? r.progressAt + ' %' : '—'}</dd></div>
        <div><dt>Dernière diffusion</dt><dd>${r.sentAt ? fmtDate(r.sentAt) : 'Pas encore envoyé'}</dd></div>
      </dl>
      ${sec('Travaux réalisés', r.works)}${sec('Observations et réserves', r.observations)}${sec('Actions à prévoir', r.actions)}
      ${snap.length ? `<div class="rv-sec"><h4>Avancement des étapes</h4><div class="rv-steps">${snap.map(s => `<div class="rv-step"><span>${esc(s.name)}</span>${cellsHTML(s.progress)}<b>${s.progress}%</b></div>`).join('')}</div></div>` : ''}`,
    foot: `<button class="btn btn-ghost btn-icon danger" id="cv-del" aria-label="Supprimer le compte rendu">${ic('trash', 18)}</button><button class="btn btn-ghost" id="cv-edit">${ic('edit', 17)} Modifier</button><button class="btn btn-primary" id="cv-mail">${ic('send', 17)} ${sent ? 'Renvoyer' : 'Valider et envoyer'}</button>`,
    onMount(sh) {
      $('#cv-edit', sh).onclick = () => { closeSheet(); reportForm(p, r); };
      $('#cv-mail', sh).onclick = () => { r.status = 'valide'; r.sentAt = Date.now(); touch(p); closeSheet(); rerender(); mailSheet(reportMail(p, r)); };
      $('#cv-del', sh).onclick = async () => {
        if (await confirmDialog({ title: 'Supprimer le compte rendu ?', message: `Le compte rendu du ${fmtDate(r.date)} sera définitivement supprimé.`, confirm: 'Supprimer' })) {
          p.reports = p.reports.filter(x => x !== r); touch(p); closeSheet(); toast('Compte rendu supprimé'); rerender();
        }
      };
    }
  });
}

/* ---------- Envoi par e-mail ---------- */
function mailSheet(m) {
  const href = 'mailto:' + m.to.join(',') + '?subject=' + encodeURIComponent(m.subject) + '&body=' + encodeURIComponent(m.body);
  const long = href.length > 1900;
  openSheet({
    title: m.title || 'Envoyer par e-mail', size: 'lg',
    body: `<div class="flabel">Destinataires</div>
      <div class="recips">${m.to.length ? m.to.map(e => `<span class="chip">${ic('mail', 13)}<span>${esc(e)}</span></span>`).join('') : '<span class="hint">Aucune adresse e-mail renseignée : vous pourrez choisir les destinataires dans votre messagerie.</span>'}</div>
      <div class="flabel">Objet</div><div class="mail-subj">${esc(m.subject)}</div>
      <div class="flabel">Message</div><pre class="mail-body">${esc(m.body)}</pre>
      ${long ? `<div class="notice warn">${ic('alert', 16)}<span>Ce message est long : certaines messageries coupent le texte pré-rempli. Si c'est le cas, utilisez « Copier » puis collez-le dans votre e-mail.</span></div>` : ''}`,
    foot: `<button class="btn btn-ghost" id="m-copy">${ic('copy', 17)} Copier</button><a class="btn btn-primary" id="m-open" href="${esc(href)}" rel="noopener">${ic('send', 17)} Ouvrir la messagerie</a>`,
    onMount(sh) {
      const a = $('#m-open', sh);
      if (window.self !== window.top) a.target = '_blank';
      a.addEventListener('click', () => setTimeout(closeSheet, 400));
      $('#m-copy', sh).onclick = () => copyText(`À : ${m.to.join(', ')}\nObjet : ${m.subject}\n\n${m.body}`, 'Message copié');
    }
  });
}

/* ---------- Étapes ---------- */
function tabEtapes(p) {
  if (!p.steps.length) return emptyState('layers', 'Aucune étape définie',
    "Listez les étapes de construction du chantier. L'avancement global est la moyenne de leur progression.",
    `<button class="btn btn-primary" data-act="new-step" data-id="${p.id}">${ic('plus', 18)} Ajouter une étape</button><button class="btn btn-ghost" data-act="pv-template" data-id="${p.id}">${ic('panel', 18)} Étapes type photovoltaïque</button>`);
  return `<div class="steps-head"><span class="hint">Faites glisser le curseur ou touchez un pourcentage.</span><button class="btn btn-ghost btn-sm" data-act="new-step" data-id="${p.id}">${ic('plus', 15)} Étape</button></div>
  <div class="list">${p.steps.map((s, i) => {
    const v = s.progress || 0;
    return `<div class="step ${v >= 100 ? 'done' : ''}">
      <div class="step-head">
        <span class="step-num">${v >= 100 ? ic('check', 15) : i + 1}</span>
        <span class="step-name">${esc(s.name)}</span>
        <b class="step-pct" data-out="${s.id}">${v}%</b>
        <div class="step-ctrl">
          <button class="mini" data-act="step-move" data-dir="-1" data-id="${p.id}" data-sid="${s.id}" ${i === 0 ? 'disabled' : ''} aria-label="Monter l'étape">${ic('up', 17)}</button>
          <button class="mini" data-act="step-move" data-dir="1" data-id="${p.id}" data-sid="${s.id}" ${i === p.steps.length - 1 ? 'disabled' : ''} aria-label="Descendre l'étape">${ic('down', 17)}</button>
          <button class="mini" data-act="edit-step" data-id="${p.id}" data-sid="${s.id}" aria-label="Modifier l'étape">${ic('edit', 17)}</button>
        </div>
      </div>
      <input type="range" min="0" max="100" step="5" value="${v}" data-step="${s.id}" aria-label="Avancement ${esc(s.name)}">
      <div class="quick-pct">${[0, 25, 50, 75, 100].map(x => `<button class="${x === v ? 'active' : ''}" data-act="step-set" data-id="${p.id}" data-sid="${s.id}" data-v="${x}">${x}%</button>`).join('')}</div>
    </div>`;
  }).join('')}</div>`;
}
function stepForm(p, s) {
  const isNew = !s, d = s || { name: '', progress: 0 };
  openSheet({
    title: isNew ? 'Nouvelle étape' : "Modifier l'étape",
    body: `<form id="sf" novalidate>
      <div class="field"><label for="sf-n">Nom de l'étape</label><input id="sf-n" name="sname" value="${esc(d.name)}" placeholder="Pose des modules" autofocus></div>
      <div class="field"><div class="flabel-row"><label for="sf-p">Avancement</label><b data-out="sf">${d.progress || 0}%</b></div><input id="sf-p" type="range" min="0" max="100" step="5" name="sprog" data-step="sf" value="${d.progress || 0}"></div>
      ${isNew && !p.steps.length ? `<p class="hint">Pour gagner du temps, les étapes type photovoltaïque peuvent être ajoutées en une fois depuis l'onglet Étapes.</p>` : ''}
    </form>`,
    foot: `${isNew ? '' : `<button class="btn btn-ghost btn-icon danger" id="sf-del" aria-label="Supprimer l'étape">${ic('trash', 18)}</button>`}<button class="btn btn-ghost" data-sheet-close>Annuler</button><button class="btn btn-primary" id="sf-save">${isNew ? "Ajouter l'étape" : 'Enregistrer'}</button>`,
    onMount(sh) {
      bindRanges(sh);
      const f = $('#sf', sh);
      const submit = () => {
        const E = f.elements, name = E.sname.value.trim();
        if (!name) { E.sname.classList.add('invalid'); E.sname.focus(); toast("Indiquez le nom de l'étape"); return; }
        if (isNew) p.steps.push({ id: uid(), name, progress: +E.sprog.value });
        else { s.name = name; s.progress = +E.sprog.value; }
        touch(p); closeSheet(); toast(isNew ? 'Étape ajoutée' : 'Étape enregistrée'); rerender();
      };
      $('#sf-save', sh).onclick = submit;
      f.onsubmit = e => { e.preventDefault(); submit(); };
      const del = $('#sf-del', sh);
      if (del) del.onclick = async () => {
        if (await confirmDialog({ title: "Supprimer l'étape ?", message: `« ${esc(s.name)} » sera retirée et l'avancement global recalculé.`, confirm: 'Supprimer' })) {
          p.steps = p.steps.filter(x => x !== s); touch(p); closeSheet(); toast('Étape supprimée'); rerender();
        }
      };
    }
  });
}

function linkForm(p, l, cat) {
  const isNew = !l, d = l || { label: '', url: '' };
  let current = cat || 'plans';
  openSheet({
    title: isNew ? 'Ajouter un lien' : 'Modifier le lien',
    body: `<form id="lf" novalidate>
      <div class="field"><div class="flabel">Catégorie</div><div class="seg" id="lf-cat">${Object.entries(LINK_CATS).map(([k, c]) => `<button type="button" data-c="${k}" class="${k === current ? 'active' : ''}">${c.l}</button>`).join('')}</div></div>
      <div class="field"><label for="lf-u">Lien</label><input id="lf-u" name="lurl" type="url" inputmode="url" value="${esc(d.url)}" placeholder="https://" autofocus></div>
      <div class="field"><label for="lf-l">Libellé</label><input id="lf-l" name="llabel" value="${esc(d.label)}" placeholder="Plan de calepinage, indice C"></div>
      <p class="hint">Collez un lien de partage : Google Drive, OneDrive, SharePoint, Dropbox, outil de planning en ligne.</p>
    </form>`,
    foot: `${isNew ? '' : `<button class="btn btn-ghost btn-icon danger" id="lf-del" aria-label="Supprimer le lien">${ic('trash', 18)}</button>`}<button class="btn btn-ghost" data-sheet-close>Annuler</button><button class="btn btn-primary" id="lf-save">${isNew ? 'Ajouter le lien' : 'Enregistrer'}</button>`,
    onMount(sh) {
      const f = $('#lf', sh);
      $('#lf-cat', sh).onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; current = b.dataset.c; $$('#lf-cat button', sh).forEach(x => x.classList.toggle('active', x === b)); };
      const submit = () => {
        const E = f.elements, url = safeUrl(E.lurl.value);
        if (!url) { E.lurl.classList.add('invalid'); E.lurl.focus(); toast('Collez un lien valide'); return; }
        const label = E.llabel.value.trim();
        if (isNew) p.links[current].push({ id: uid(), label, url });
        else {
          l.label = label; l.url = url;
          if (current !== cat) { p.links[cat] = p.links[cat].filter(x => x !== l); p.links[current].push(l); }
        }
        touch(p); closeSheet(); toast(isNew ? 'Lien ajouté' : 'Lien enregistré'); rerender();
      };
      $('#lf-save', sh).onclick = submit;
      f.onsubmit = e => { e.preventDefault(); submit(); };
      const del = $('#lf-del', sh);
      if (del) del.onclick = async () => {
        if (await confirmDialog({ title: 'Supprimer le lien ?', message: `« ${esc(l.label || hostOf(l.url))} » sera retiré du projet.`, confirm: 'Supprimer' })) {
          p.links[cat] = p.links[cat].filter(x => x !== l); touch(p); closeSheet(); toast('Lien supprimé'); rerender();
        }
      };
    }
  });
}

/* =========================================================
   Vue globale (tableau de synthèse)
   ========================================================= */
let gSort = { k: 'updated', dir: -1 }, gQuery = '';
const GCOLS = [
  { k: 'name', l: 'Projet' }, { k: 'address', l: 'Adresse' }, { k: 'progress', l: 'Avancement' }, { k: 'step', l: 'Étape en cours' },
  { k: 'open', l: 'Demandes ouvertes' }, { k: 'late', l: 'En retard' }, { k: 'reports', l: 'Comptes rendus' }, { k: 'lastReport', l: 'Dernier CR' }, { k: 'team', l: 'Équipe' }
];
function rowData(p) {
  const lr = lastReport(p);
  return { p, name: p.name, address: p.address || '', progress: progress(p), step: currentStep(p), open: openReq(p), late: lateReq(p), reports: p.reports.length, lastReport: lr ? lr.date : '', team: p.users.map(u => u.name).join(', '), updated: p.updatedAt || 0 };
}
function sortedRows() {
  const rows = state.projects.map(rowData).filter(r => matches(r.p, gQuery));
  rows.sort((a, b) => {
    const x = a[gSort.k], y = b[gSort.k];
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'fr')) * gSort.dir;
  });
  return rows;
}
function renderGlobal() {
  const ps = state.projects, n = ps.length;
  const avg = n ? Math.round(ps.reduce((a, p) => a + progress(p), 0) / n) : 0;
  const open = ps.reduce((a, p) => a + openReq(p), 0), late = ps.reduce((a, p) => a + lateReq(p), 0);
  const since = dayOffset(-30), cr30 = ps.reduce((a, p) => a + p.reports.filter(r => (r.date || '') >= since).length, 0);
  $('#app').innerHTML = `<div class="wrap wide">
    <header class="appbar">
      <button class="icon-btn" data-act="home" aria-label="Retour aux projets">${ic('back')}</button>
      <div class="titlebox"><h1>Vue globale</h1><span class="hint">Synthèse de ${plural(n, 'projet')}</span></div>
      <button class="btn btn-ghost btn-sm hide-sm" data-act="copy-table">${ic('copy', 16)} Copier pour Excel</button>
      <button class="icon-btn" data-act="export-csv" aria-label="Exporter en CSV" title="Exporter en CSV">${ic('download')}</button>
    </header>
    <div class="kpis four">
      <div class="kpi"><b>${avg}%</b><span>Avancement moyen</span></div>
      <div class="kpi"><b>${open}</b><span>Demandes ouvertes</span></div>
      <div class="kpi ${late ? 'alert' : ''}"><b>${late}</b><span>Demandes en retard</span></div>
      <div class="kpi"><b>${cr30}</b><span>Comptes rendus sur 30 jours</span></div>
    </div>
    <div class="gtoolbar"><div class="search">${ic('search', 19)}<input id="gq" type="search" placeholder="Filtrer les projets" value="${esc(gQuery)}" autocomplete="off"></div></div>
    <div class="table-wrap" id="gtable"></div>
  </div>`;
  renderGTable();
  const q = $('#gq'); q.addEventListener('input', () => { gQuery = q.value; renderGTable(); });
}
function renderGTable() {
  const w = $('#gtable'); if (!w) return;
  if (!state.projects.length) { w.innerHTML = `<div style="padding:16px">${emptyState('table', 'Aucun projet', 'Les projets créés apparaîtront ici sous forme de tableau.', `<button class="btn btn-primary" data-act="home">Revenir aux projets</button>`)}</div>`; return; }
  const rows = sortedRows();
  w.innerHTML = `<table><thead><tr>${GCOLS.map(c => `<th data-act="gsort" data-k="${c.k}" class="${gSort.k === c.k ? 'sorted' : ''}" aria-sort="${gSort.k === c.k ? (gSort.dir > 0 ? 'ascending' : 'descending') : 'none'}">${c.l}<span class="sort">${gSort.k === c.k ? (gSort.dir > 0 ? '▲' : '▼') : '▲▼'}</span></th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr data-act="open-project" data-id="${r.p.id}" tabindex="0">
    <td><b>${esc(r.name)}</b></td>
    <td class="muted">${esc(r.address || '—')}</td>
    <td><div class="tprog">${cellsHTML(r.progress)}<b>${r.progress}%</b></div></td>
    <td>${esc(r.step)}</td>
    <td class="num">${r.open ? `<span class="pill st-ouverte">${r.open}</span>` : '<span class="muted">0</span>'}</td>
    <td class="num">${r.late ? `<span class="pill pr-haute">${r.late}</span>` : '<span class="muted">0</span>'}</td>
    <td class="num">${r.reports}</td>
    <td>${r.lastReport ? fmtDate(r.lastReport) : '<span class="muted">—</span>'}</td>
    <td><span class="avatars">${r.p.users.slice(0, 5).map(u => avatar(u.name)).join('')}</span></td>
  </tr>`).join('')}</tbody></table>${rows.length ? '' : '<div class="empty-line" style="margin:12px">Aucun projet ne correspond au filtre.</div>'}`;
}
function tableMatrix() {
  return [['Projet', 'Adresse', 'Avancement (%)', 'Étape en cours', 'Demandes ouvertes', 'Demandes en retard', 'Comptes rendus', 'Dernier CR', 'Équipe'],
    ...sortedRows().map(r => [r.name, r.address, r.progress, r.step, r.open, r.late, r.reports, r.lastReport ? fmtDate(r.lastReport) : '', r.team])];
}

/* =========================================================
   Paramètres, sauvegarde, exemple
   ========================================================= */
function applyTheme() {
  const t = state.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
function settingsSheet() {
  const th = state.settings.theme || 'auto';
  openSheet({
    title: 'Paramètres',
    body: `<div class="flabel">Compte</div>
      <div class="acct">${ic('users')}<span><b>${esc(FB.email)}</b><small>Chantiers synchronisés sur tous vos appareils</small></span></div>
      <button class="btn btn-ghost btn-block mb" id="s-out">Se déconnecter</button>
      <div class="field"><label for="s-name">Votre nom</label><input id="s-name" value="${esc(state.settings.userName)}" placeholder="Utilisé comme rédacteur par défaut" autocomplete="name"></div>
      <div class="field"><div class="flabel">Apparence</div><div class="seg" id="s-theme">${[['auto', 'Automatique'], ['light', 'Clair'], ['dark', 'Sombre']].map(([k, l]) => `<button type="button" data-t="${k}" class="${k === th ? 'active' : ''}">${l}</button>`).join('')}</div></div>
      <div class="flabel">Données</div>
      <div class="settings-list">
        <button class="srow" id="s-export">${ic('download')}<span><b>Exporter une sauvegarde</b><small>Fichier JSON contenant tous les projets</small></span></button>
        <label class="srow">${ic('upload')}<span><b>Importer une sauvegarde</b><small>Remplace les données de cet appareil</small></span><input type="file" id="s-import" accept="application/json,.json" hidden></label>
        <button class="srow" id="s-demo">${ic('panel')}<span><b>Ajouter le projet exemple</b><small>Pour découvrir l'application</small></span></button>
        <button class="srow danger" id="s-reset">${ic('trash')}<span><b>Supprimer tous mes projets</b><small>Suppression définitive pour toute l'équipe</small></span></button>
      </div>
      <p class="hint mt">Les chantiers sont enregistrés sur votre compte et partagés avec les adresses e-mail de l'équipe. L'application reste utilisable hors connexion : les modifications partent au retour du réseau.</p>`,
    foot: `<button class="btn btn-primary btn-block" data-sheet-close>Fermer</button>`,
    onMount(sh) {
      $('#s-out', sh).onclick = () => doSignOut();
      $('#s-name', sh).addEventListener('input', e => { state.settings.userName = e.target.value.trim(); save(); });
      $('#s-theme', sh).onclick = e => {
        const b = e.target.closest('[data-t]'); if (!b) return;
        state.settings.theme = b.dataset.t; save(); applyTheme();
        $$('#s-theme button', sh).forEach(x => x.classList.toggle('active', x === b));
      };
      $('#s-export', sh).onclick = () => downloadFile(JSON.stringify(state, null, 2), `suivi-chantiers-sauvegarde-${today()}.json`, 'application/json');
      $('#s-import', sh).onchange = e => {
        const file = e.target.files[0]; if (!file) return;
        const rd = new FileReader();
        rd.onload = async () => {
          try {
            const d = JSON.parse(rd.result);
            if (!d || !Array.isArray(d.projects)) throw new Error('format');
            const ok = await confirmDialog({ title: 'Importer la sauvegarde ?', message: `${plural(d.projects.length, 'projet')} vont être ajoutés à votre compte. Les projets déjà présents seront mis à jour.`, confirm: 'Importer', danger: false });
            if (!ok) return;
            const inc = normalize(d).projects;
            const byId = new Map(state.projects.map(p => [p.id, p]));
            inc.forEach(p => {
              if (!p.ownerEmail) p.ownerEmail = FB.email;
              const cur = byId.get(p.id);
              if (cur) Object.assign(cur, p); else state.projects.push(p);
            });
            save(); applyTheme(); closeSheet(); toast(plural(inc.length, 'projet') + ' importé' + (inc.length > 1 ? 's' : '')); go('#/');
          } catch (err) { toast("Ce fichier n'est pas une sauvegarde valide"); }
        };
        rd.readAsText(file);
      };
      $('#s-demo', sh).onclick = () => { const d = demoProject(); d.ownerEmail = FB.email; state.projects.push(d); save(); closeSheet(); toast('Projet exemple ajouté'); go('#/'); };
      $('#s-reset', sh).onclick = async () => {
        if (await confirmDialog({ title: 'Supprimer tous vos projets ?', message: "Les projets seront supprimés pour toute l'équipe, sur tous les appareils. Exportez une sauvegarde avant.", confirm: 'Tout supprimer' })) {
          state.projects = []; save(); closeSheet(); toast('Données effacées'); go('#/');
        }
      };
    }
  });
}

/* =========================================================
   Actions (délégation d'événements)
   ========================================================= */
const findP = el => getP(el.dataset.id);
const ACTS = {
  home: () => go('#/'),
  global: () => go('#/global'),
  settings: () => settingsSheet(),
  'new-project': () => projectForm(),
  demo: () => { const d = demoProject(); d.ownerEmail = FB.email; state.projects.push(d); save(); toast('Projet exemple ajouté'); rerender(); },
  'open-project': el => { if (suppressClick) { suppressClick = false; return; } go('#/p/' + el.dataset.id); },
  'edit-project': el => { const p = findP(el); if (p) projectForm(p); },
  'req-filter': el => { reqFilter = el.dataset.f; rerender(); },
  'cr-all': () => { crAll = true; rerender(); },
  'new-request': el => requestForm(findP(el)),
  'view-request': el => { const p = findP(el), r = p && p.requests.find(x => x.id === el.dataset.rid); if (r) viewRequest(p, r); },
  'new-report': el => reportForm(findP(el)),
  'view-report': el => { const p = findP(el), r = p && p.reports.find(x => x.id === el.dataset.rid); if (r) viewReport(p, r); },
  'new-step': el => stepForm(findP(el)),
  'edit-step': el => { const p = findP(el), s = p && p.steps.find(x => x.id === el.dataset.sid); if (s) stepForm(p, s); },
  'pv-template': el => { const p = findP(el); PV_TEMPLATE.forEach(n => p.steps.push({ id: uid(), name: n, progress: 0 })); touch(p); toast(`${PV_TEMPLATE.length} étapes ajoutées`); rerender(); },
  'step-set': el => { const p = findP(el), s = p && p.steps.find(x => x.id === el.dataset.sid); if (s) { s.progress = +el.dataset.v; touch(p); rerender(); } },
  'step-move': el => {
    const p = findP(el), i = p.steps.findIndex(x => x.id === el.dataset.sid), j = i + (+el.dataset.dir);
    if (i < 0 || j < 0 || j >= p.steps.length) return;
    [p.steps[i], p.steps[j]] = [p.steps[j], p.steps[i]]; touch(p); rerender();
  },
  'add-link': el => linkForm(findP(el), null, el.dataset.cat),
  'edit-link': el => { const p = findP(el), l = p && p.links[el.dataset.cat].find(x => x.id === el.dataset.lid); if (l) linkForm(p, l, el.dataset.cat); },
  'new-contact': el => contactForm(findP(el)),
  'edit-contact': el => { const p = findP(el), c = p && p.contacts.find(x => x.id === el.dataset.cid); if (c) contactForm(p, c); },
  gsort: el => { const k = el.dataset.k; if (gSort.k === k) gSort.dir *= -1; else gSort = { k, dir: ['progress', 'open', 'late', 'reports', 'lastReport'].includes(k) ? -1 : 1 }; renderGTable(); },
  'copy-table': () => copyText(tableMatrix().map(r => r.map(v => String(v).replace(/[\t\n]/g, ' ')).join('\t')).join('\n'), 'Tableau copié : collez-le dans Excel'),
  'export-csv': () => {
    const csv = '\ufeff' + tableMatrix().map(r => r.map(v => { const s = String(v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
    downloadFile(csv, `synthese-projets-${today()}.csv`, 'text/csv;charset=utf-8');
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const fn = ACTS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON' && el.type === 'button' && el.closest('form')) e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.matches && t.matches('.pcard,.item,tr[data-act],.item-main[data-act]')) { e.preventDefault(); t.click(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && t.matches && t.matches('.pcard')) { e.preventDefault(); askDeleteProject(t.dataset.id); }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(t.tagName || '') && !$('#sheet-root').classList.contains('open')) {
    const q = $('#q') || $('#gq'); if (q) { e.preventDefault(); q.focus(); }
  }
});

/* =========================================================
   Démarrage
   ========================================================= */
applyTheme();
authSetup();
if (navigator.serviceWorker && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();
</script>
